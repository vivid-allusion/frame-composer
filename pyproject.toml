[project]
name = "image-generator"
version = "2.1.0"
description = "Vivid Allusion Image Generator"
requires-python = ">=3.10"
dependencies = [
    "loguru",
    "pyyaml",
    "python-dotenv",
    "rich",
    "pillow",
]

[project.scripts]
image-generator = "src.main_simple:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
